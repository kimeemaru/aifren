name: Windows portable ownership
on:
  workflow_dispatch:
  push:
    branches: [feature/character-voices-portable]
    paths:
      - aifren/runtime/file_lock.py
      - aifren/character/**
      - tests/test_portable_file_lock.py
      - .github/workflows/windows-portable-check.yml
      - scripts/windows_runtime_requirements.txt
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Synthetic ownership checks (no models, audio, private data or artifact upload)
        run: python -m unittest discover -s tests -p test_portable_file_lock.py -v
  embedded-backend:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Assemble pinned Windows interpreter and dependencies
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Portable runtime Ω'
          New-Item -ItemType Directory -Force "$root/runtime/python" | Out-Null
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile "$root/python.zip"
          if ((Get-FileHash "$root/python.zip" -Algorithm SHA256).Hash.ToLower() -ne '4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3') { throw 'Interpreter digest mismatch' }
          Expand-Archive "$root/python.zip" "$root/runtime/python"
          python -m pip install --no-deps --target "$root/runtime/python/Lib/site-packages" -r scripts/windows_runtime_requirements.txt
          if ($LASTEXITCODE) { throw 'Windows dependency staging failed' }
          Invoke-WebRequest 'https://api.anaconda.org/download/conda-forge/hnswlib/0.8.0/win-64/hnswlib-0.8.0-py312h9b46583_2.conda' -OutFile "$root/hnswlib.zip"
          if ((Get-FileHash "$root/hnswlib.zip" -Algorithm SHA256).Hash.ToLower() -ne '3a4510cbe62013478b171496a7bc362abf629b04a6db8ffa8a502607f3ef1e47') { throw 'Index runtime digest mismatch' }
          # The runner's tar.exe converts Unicode arguments through its ANSI
          # code page. Extract in an ASCII build directory, then use Unicode-
          # aware PowerShell to stage into the actual portable-path test.
          $indexBuild = Join-Path $env:RUNNER_TEMP 'hnsw-build'
          Expand-Archive "$root/hnswlib.zip" $indexBuild
          Push-Location $indexBuild
          $archive = (Get-ChildItem 'pkg-*.tar.zst').Name
          tar -xf $archive
          if ($LASTEXITCODE) { throw 'Native index extraction failed' }
          Pop-Location
          Copy-Item "$indexBuild/Lib/*" "$root/runtime/python/Lib" -Recurse -Force
          Copy-Item "$root/runtime/python/Lib/site-packages/torch/lib/msvcp140*.dll" "$root/runtime/python"
          "python312.zip`n.`nLib/site-packages`n../app`nimport site" | Set-Content "$root/runtime/python/python312._pth" -Encoding utf8NoBOM
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'scripts'); from package_linux import copy_application; copy_application(Path.cwd(),Path(sys.argv[1]))" "$root/runtime/app"
          "PORTABLE_TEST_ROOT=$root" >> $env:GITHUB_ENV
      - name: Native packaged imports and the same synthetic amber service fixture
        shell: pwsh
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          PYNPUT_BACKEND: dummy
        run: |
          @'
          import importlib, os, pathlib, sys, tempfile, unittest
          root = pathlib.Path(sys.argv[1]); source = pathlib.Path(sys.argv[2])
          os.environ['AIFREN_DATA_ROOT'] = str(root/'synthetic-data')
          os.environ['AIFREN_RESOURCE_ROOT'] = str(root/'runtime/app')
          for name in ('numpy','hnswlib','torch','llama_cpp','kokoro','faster_whisper','onnxruntime','sounddevice','pynput','aifren.assistant_service'):
              module = importlib.import_module(name)
              assert pathlib.Path(module.__file__).is_relative_to(root), name
              print('Bundled import passed:', name)
          # Exercise the actual bundled native phonemizer, not merely Kokoro's
          # Python import. No voice/model download, recording or device input.
          from scripts.launch_friend import prepare_packaged_phonemizer
          prepare_packaged_phonemizer()
          import misaki.espeak
          from phonemizer.backend import EspeakBackend
          phonemes = EspeakBackend('en-us', preserve_punctuation=True).phonemize(['Amber is a color.'], strip=True)
          assert len(phonemes) == 1 and phonemes[0].strip()
          print('Bundled native phonemization passed')
          import onnxruntime, sounddevice, av
          assert 'CPUExecutionProvider' in onnxruntime.get_available_providers()
          assert isinstance(sounddevice.query_hostapis(), tuple)
          assert av.library_versions
          print('ONNX CPU, audio host discovery and codec runtime passed (no playback claim)')
          # aifren is already bound to the staged tree; public tests are fixtures,
          # not a fallback implementation or bundled application dependency.
          sys.path[:0] = [str(source/'tests'),str(source)]
          import test_literal_preference_recall as regression
          suite = unittest.defaultTestLoader.loadTestsFromModule(regression)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert all(pathlib.Path(m.__file__).is_relative_to(root) for n,m in sys.modules.items() if n.startswith('aifren.') and getattr(m,'__file__',None))
          raise SystemExit(0 if result.wasSuccessful() else 1)
          '@ | Set-Content "$env:PORTABLE_TEST_ROOT/check.py" -Encoding utf8NoBOM
          & "$env:PORTABLE_TEST_ROOT/runtime/python/python.exe" -I "$env:PORTABLE_TEST_ROOT/check.py" "$env:PORTABLE_TEST_ROOT" "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE) { throw 'Packaged native backend checks failed' }
